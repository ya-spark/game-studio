# The studio's only entry point for work from GitHub (also from the phone, overnight).
#   - Open an issue from a form ([new-game] / [change]): starts a run.
#   - Write `@claude ...` in an issue comment (or a PR comment/review): continues or adjusts it.
# The run starts at the game-studio root with all submodules checked out, so the skills and agents
# in .claude/ apply. It follows the overnight rules in CLAUDE.md: it pushes each touched submodule's
# `main` and moves the pin here. See docs/INBOX.md.
#
# Needs: the Claude GitHub App (https://github.com/apps/claude) on the repos, and two secrets here:
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token`
#   CROSS_REPO_TOKEN         fine-grained token, Contents + Pull requests + Issues write on
#                            game-studio, game-factory and every game repo
# It never references the release secrets (keystore, Play service account), those live in the game repos.
name: claude

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  # Pinned. Keep in sync with the game repos' ci.yml and the factory's .flutter-version.
  FLUTTER_VERSION: "3.47.8"

# One run at a time per issue or PR, and never cancel one that is mid-push.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Only the owner (yaseengem) can start a run. The repos are public and the CROSS_REPO_TOKEN can
    # write to every main, so this check is the gate. The sender login cannot be spoofed;
    # author_association was not reliable for a private org member (the run was skipped).
    if: >-
      github.event.sender.login == 'yaseengem'
      && (
        (github.event_name == 'issues'
          && (startsWith(github.event.issue.title, '[new-game]')
            || startsWith(github.event.issue.title, '[change]')
            || contains(github.event.issue.body, '@claude')))
        || (github.event_name == 'issue_comment'
          && contains(github.event.comment.body, '@claude'))
        || (github.event_name == 'pull_request_review_comment'
          && contains(github.event.comment.body, '@claude'))
        || (github.event_name == 'pull_request_review'
          && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a stuck run must not burn the quota overnight
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      # Submodules are checked out detached at the pinned commit. Work happens on main.
      - name: Put every submodule on its main
        shell: bash
        run: |
          git config --global user.name "claude[bot]"
          git config --global user.email "noreply@anthropic.com"
          git submodule foreach --recursive 'git checkout main && git pull --ff-only origin main'
          git submodule status

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Remember when this run started, to check at the end that it commented on the issue.
      - name: Note the start time
        id: t0
        run: echo "start=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CROSS_REPO_TOKEN }}
          # A new form issue has no @claude mention, so give it an explicit instruction.
          # Comment events carry their own @claude request.
          prompt: >-
            ${{ github.event_name == 'issues' && format('Handle issue #{0} in ya-spark/game-studio: {1}. Follow CLAUDE.md (overnight rules), docs/INBOX.md and the /new-app or /change-app skill that matches the title. Whatever happens, finish by commenting on the issue with `gh issue comment {0} --body ...`: what you changed with commit links, or exactly what stopped you (for example a denied tool).', github.event.issue.number, github.event.issue.title) || '' }}
          claude_args: >-
            --max-turns 100
            --allowedTools "Edit,Write,MultiEdit,Bash(git:*),Bash(gh run:*),Bash(gh issue:*),Bash(flutter:*),Bash(dart:*),Bash(python3 game-factory/scripts/*),Bash(bash apps/*/scripts/*),Bash(bash scripts/*)"

      # A run is only done when it commented on the issue (what changed, or what stopped it).
      # A run that ends without a comment, for example after a denied tool, used to show a green
      # check; this step turns it red instead. It only looks at comments written after this run began.
      - name: Fail if the run left no comment on the issue
        if: success() && (github.event_name == 'issues' || github.event_name == 'issue_comment')
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          START: ${{ steps.t0.outputs.start }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE}/comments?since=${START}&per_page=100" --jq "[.[] | select(.created_at >= \"${START}\")] | length")
          echo "Comments on #${ISSUE} since ${START}: ${count}"
          if [ "${count}" = "0" ]; then
            echo "::error::The run finished without commenting on issue #${ISSUE}. Treat it as not done."
            exit 1
          fi
