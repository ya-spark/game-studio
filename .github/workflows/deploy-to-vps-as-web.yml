# Deploy the web build of every game (or chosen games) from `main` to the Hostinger VPS for UAT.
# Started by hand only: Actions, deploy-to-vps-as-web, Run workflow. See docs/DEPLOY-TO-VPS-AS-WEB.md.
#
# Builds each game's current main (not the pinned commit), uploads the built games over SSH, and the VPS builds
# one Docker image with all games and restarts the container game-studio, via scripts/deploy.sh. The login (basic auth) and the Caddy
# route live in the cloud-deploy master repo; a one-off `scripts/deploy.sh proxy` there adds the route.
#
# Repo secrets (Settings, Secrets and variables, Actions; never in a file):
#   CROSS_REPO_TOKEN     already used by run-claude-from-issues.yml (read access to every submodule, incl. private ones)
#   VPS_SSH_KEY          private key of a deploy key authorised for the VPS deploy user
#   VPS_SSH_HOST         VPS host name or IP
#   VPS_SSH_USER         SSH user (track)
#   VPS_SSH_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <host>`
name: deploy-to-vps-as-web

on:
  workflow_dispatch:
    inputs:
      games:
        description: "Games to deploy, space separated (empty = all), e.g. wingy mind-1"
        required: false
        default: ""
      dry_run:
        description: "Build only, do not upload"
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time; never cancel one that is mid-upload.
concurrency:
  group: deploy-to-vps-as-web
  cancel-in-progress: false


jobs:
  deploy-to-vps-as-web:
    # Only the owner can start a run (same gate as run-claude-from-issues.yml).
    if: github.actor == 'yaseengem'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      # Submodules are checked out detached at the pinned commit. UAT tests main.
      - name: Put the games on their main
        run: |
          git submodule foreach 'case "$sm_path" in apps/*) git checkout main && git pull --ff-only origin main ;; esac'
          git submodule status -- apps

      - name: Read the Flutter pin
        id: flutter
        run: echo "version=$(tr -d '[:space:]' < game-factory/.flutter-version)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: Deploy
        env:
          GAMES: ${{ inputs.games }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          SSH_USER: ${{ secrets.VPS_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$DRY_RUN" ]; then
            [ -n "$SSH_KEY" ] && [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_KNOWN_HOSTS" ] \
              || { echo "VPS_SSH_* secrets are not set"; exit 1; }
            umask 077
            install -m 700 -d ~/.ssh
            printf '%s\n' "$SSH_KEY" > ~/.ssh/web_vps_key
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            export VPS_HOST="$SSH_HOST" VPS_USER="$SSH_USER" VPS_SSH_KEY_PATH="$HOME/.ssh/web_vps_key"
          fi
          # shellcheck disable=SC2086
          bash scripts/deploy.sh $GAMES
          rm -f ~/.ssh/web_vps_key
