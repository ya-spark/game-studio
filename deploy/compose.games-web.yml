# The public web versions of the games (games-web repo). Runs on the VPS from its own deploy directory,
# next to (never inside) the game-studio UAT container. scripts/deploy-games-web.sh sets TAG and PORT.
services:
  games-web:
    image: games-web:${TAG:-latest}
    container_name: games-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:?PORT is required}:${PORT}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+process.env.SERVE_PORT+process.env.SERVE_BASE+'/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
